[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cuwave"
version = "0.1.0"
description = "GPU finite-difference wave solver with differentiable adjoints"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Leon Herrmann", email = "herrmann.leon@pm.me"}]
requires-python = ">=3.10"
keywords = ["wave-equation", "finite-difference", "adjoint", "full-waveform-inversion",
            "topology-optimization", "cuda", "cupy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
# CuPy is intentionally omitted: install the wheel matching your CUDA toolkit,
# e.g. `pip install cupy-cuda12x`.
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# Only the drivers and `cuwave.postprocessing` plot; the solver never imports matplotlib.
examples = ["matplotlib>=3.7", "pillow>=9.1"]
# Only `cuwave.nn` needs torch; the solver and its adjoints are cupy throughout.
nn = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/cmpmech/cuwave"
Documentation = "https://github.com/cmpmech/cuwave/blob/main/docs/Home.md"
Changelog = "https://github.com/cmpmech/cuwave/releases"

[tool.setuptools]
packages = ["cuwave", "cuwave.kernels"]

[tool.setuptools.package-data]
cuwave = ["kernels/*.cu", "kernels/*.cuh"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
# pinned explicitly so the rule set does not drift with the installed ruff
select = ["E4", "E7", "E9", "F"]
# module-level lambda objectives are the driver house style
ignore = ["E731"]
