name: publish

# a pushed v* tag builds the sdist and the pure-python wheel and uploads them to
# pypi through trusted publishing (no token: the `pypi` environment carries the
# oidc identity registered on pypi for this repository and workflow)
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # the version in pyproject must be the tag, or the upload lands under the
      # wrong number and pypi never lets it be reused
      - name: check tag matches version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "${GITHUB_REF_NAME}" \
            || { echo "tag ${GITHUB_REF_NAME} but pyproject says $version"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
