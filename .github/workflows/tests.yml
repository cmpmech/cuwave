name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # cupy is imported at module level throughout, so it must be installed even
      # though the runner has no GPU: HAS_CUDA turns false and the kernels skip.
      # torch is the cpu wheel, which is what HAS_TORCH needs and far smaller
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install cupy-cuda12x
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install pytest

      # the CUDA tests skip here; this pins imports, the stencil math and the optimizers
      - name: test
        run: pytest tests/ -q
