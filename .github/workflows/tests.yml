name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # no cupy: the runner has no GPU, so cuwave runs on the CPU, compiling the
      # kernels with the runner's g++ and OpenMP; the cpu extra brings scipy.
      # torch is the cpu wheel, which is what HAS_TORCH needs and far smaller
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[cpu]"
          pip install pytest

      # the solver runs on the CPU here; only the GPU-only classes skip (ON_GPU)
      - name: test
        run: pytest tests/ -q -rs
