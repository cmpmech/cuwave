name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # cupy is imported at module level throughout, so it must be installed even
      # though the runner has no GPU: HAS_CUDA turns false and the kernels skip
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install cupy-cuda12x
          pip install -e .
          pip install pytest

      # the CUDA tests skip here; this pins imports, the stencil math and the optimizers
      - name: test
        run: pytest tests/ -q
