<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="The 2D scalar wave equation in the browser, stepped by cuwave's kernels compiled to WebAssembly.">
<title>cuwave demo</title>
<script>
// the light or dark mode chosen with the toggle, before the page is drawn
try { const theme = localStorage.getItem("theme"); if (theme) document.documentElement.dataset.theme = theme; } catch (e) {}
</script>
<script src="coi.js"></script>
<style>
  @font-face { font-family: "CMU Typewriter"; src: url(fonts/cmuntt.otf); } /* fonts/OFL.txt */
  @font-face { font-family: "CMU Typewriter"; font-weight: 700; src: url(fonts/cmuntb.otf); }
  :root { --fg: #222; --bg: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fg: #ddd; --bg: #190c09; } }
  :root[data-theme="dark"] { --fg: #ddd; --bg: #190c09; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font: 16px/1.4 "CMU Typewriter", ui-monospace, monospace; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: crosshair; }
  button, a { color: inherit; font: inherit; background: none; border: 0; padding: 6px 8px;
    cursor: pointer; text-decoration: none; }
  button:hover, a:hover, button:focus-visible, a:focus-visible { text-decoration: underline; }
  #bar, .edge, .theme { text-shadow: 0 0 2px var(--bg), 0 0 5px var(--bg), 0 0 10px var(--bg); }
  #bar { position: fixed; top: 8px; right: 8px; display: flex; align-items: center; }
  .theme { position: fixed; top: 8px; left: 8px; line-height: 1; font-size: 18px; }
  #backend { opacity: 0.6; text-decoration: underline dotted; }
  #backend:not([href]) { cursor: auto; text-decoration: none; }
  .edge { position: fixed; }
  .edge:nth-of-type(1) { top: 8px; left: 50%; transform: translateX(-50%); }
  .edge:nth-of-type(2) { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .edge:nth-of-type(3), .edge:nth-of-type(4) { top: 50%; writing-mode: vertical-rl; padding: 8px 6px; }
  .edge:nth-of-type(3) { left: 8px; transform: translateY(-50%) rotate(180deg); }
  .edge:nth-of-type(4) { right: 8px; transform: translateY(-50%); }
  #help { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: max-content;
    max-width: calc(100vw - 96px); box-sizing: border-box; padding: min(18px, 4vw) min(26px, 5vw);
    font-size: min(22px, 5.4vw);
    background: var(--bg); border: 1px solid var(--fg); pointer-events: none; transition: opacity 0.6s; }
  #help p { margin: 4px 0; }
  #help.gone { opacity: 0; }
  #help #pitch { margin-top: 1em; font-size: 0.8em; opacity: 0.7; }
  .whole { white-space: nowrap; }
  body.narrow #bar { flex-direction: column; align-items: flex-end; } /* demo.js fit */
</style>
</head>
<body>
<canvas aria-label="Wave field: click to emit a wave, drag to draw walls, drag from a wall to erase"></canvas>
<div id="edges">
  <button class="edge" type="button" aria-label="top boundary condition"></button>
  <button class="edge" type="button" aria-label="bottom boundary condition"></button>
  <button class="edge" type="button" aria-label="left boundary condition"></button>
  <button class="edge" type="button" aria-label="right boundary condition"></button>
</div>
<button class="theme" type="button" aria-label="Switch between light and dark">&#9680;</button>
<div id="bar">
  <a id="backend"></a>
  <button id="reset" type="button">reset</button>
  <a href="https://github.com/cmpmech/cuwave">cuwave</a>
</div>
<div id="help">
  <p>click to emit a source</p>
  <p>click &amp; drag to draw an obstacle</p>
  <p>click an edge label to change its boundary condition</p>
  <p id="pitch"><span id="faster">want it about 100&times; faster? on an NVIDIA GPU:<br></span><b>pip install cuwave <span class="whole">cupy-cuda12x</span></b></p>
</div>
<noscript><p style="padding: 16px">The demo needs JavaScript and WebAssembly.</p></noscript>
<script src="gpu.js"></script>
<script src="demo.js"></script>
</body>
</html>
